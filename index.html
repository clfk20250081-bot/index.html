<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRスタンプラリー</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f7f9fa; color: #333; }
        .rally-container { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .stamp-card { width: 100px; height: 100px; border: 3px dashed #bbb; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: white; font-weight: bold; }
        .stamp-card.active { border-style: solid; border-color: #ff4757; background-color: #ffeaa7; color: #ff4757; }
        .stamp-mark { font-size: 32px; display: none; }
        .stamp-card.active .stamp-mark { display: block; }
        .stamp-card.active .stamp-num { display: none; }
        .btn-clear { margin-top: 40px; padding: 10px 20px; font-size: 14px; cursor: pointer; }
        .info { background: #eccc68; padding: 10px; margin: 20px auto; max-width: 400px; border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body>

    <h1>QRコード スタンプラリー</h1>
    <p>スポットのQRコードを読み取ってスタンプを集めよう！</p>
    
    <div id="message" class="info" style="display:none;"></div>

    <!-- スタンプカード -->
    <div class="rally-container">
        <div id="spot1" class="stamp-card"><span class="stamp-num">1番目の<br>スポット</span><span class="stamp-mark">💮</span></div>
        <div id="spot2" class="stamp-card"><span class="stamp-num">2番目の<br>スポット</span><span class="stamp-mark">💮</span></div>
        <div id="spot3" class="stamp-card"><span class="stamp-num">3番目の<br>スポット</span><span class="stamp-mark">💮</span></div>
    </div>

    <button class="btn-clear" onclick="clearRally()">データをリセット</button>

    <script>
        // ページが読み込まれたときの処理
        window.onload = function() {
            // 1. すでに獲得しているスタンプを表示
            for (let i = 1; i <= 3; i++) {
                if (localStorage.getItem('qr_spot' + i) === 'cleared') {
                    document.getElementById('spot' + i).classList.add('active');
                }
            }

            // 2. URLの後ろについている文字（?spot=1 など）をチェック
            const urlParams = new URLSearchParams(window.location.search);
            const spotId = urlParams.get('spot'); // 例: '1' や '2'

            if (spotId && ['1', '2', '3'].includes(spotId)) {
                // スタンプを記憶させる
                localStorage.setItem('qr_spot' + spotId, 'cleared');
                // 画面の見た目を変える
                document.getElementById('spot' + spotId).classList.add('active');
                
                // メッセージを表示
                const msgDiv = document.getElementById('message');
                msgDiv.style.display = 'block';
                msgDiv.innerText = `「スポット ${spotId}」のスタンプをゲットしました！🎉`;

                // コンプリートチェック
                checkComplete();
            }
        };

        function checkComplete() {
            let count = 0;
            for (let i = 1; i <= 3; i++) {
                if (localStorage.getItem('qr_spot' + i) === 'cleared') count++;
            }
            if (count === 3) {
                setTimeout(() => { alert('全スポット制覇！コンプリートおめでとうございます！🏆'); }, 500);
            }
        }

        function clearRally() {
            localStorage.clear();
            // URLの「?spot=...」を消してきれいにリロード
            window.location.href = window.location.pathname;
        }
    </script>
</body>
</html>
